name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: 🧹 Ruff lint
        run: |
          echo "::group::Running Ruff lint"
          uv run ruff check .
          echo "::endgroup::"

      - name: 🎨 Ruff format check
        run: |
          echo "::group::Running Ruff format check"
          uv run ruff format --check .
          echo "::endgroup::"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: 🔍 Mypy type checking
        run: |
          echo "::group::Running Mypy"
          uv run mypy app/
          echo "::endgroup::"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: 🔐 Bandit security scan
        run: |
          echo "::group::Running Bandit"
          uv run bandit -r app/
          echo "::endgroup::"

      - name: 🧯 Safety dependency check
        run: |
          echo "::group::Running Safety"
          uv run safety check
          echo "::endgroup::"

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: 🧪 Run tests
        run: |
          echo "::group::Running tests"
          uv run pytest --cov=app --cov-report=term --cov-report=xml
          echo "::endgroup::"

      - name: Upload coverage to Codecov (public repo only)
        uses: codecov/codecov-action@v3
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          files: coverage.xml
          fail_ci_if_error: false

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 🪝 Run pre-commit hooks
        uses: pre-commit/action@v3.0.0
